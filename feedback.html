<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Feedback</title>
</head>
<body>
    <main>
        <h1>Formulário de Feedback</h1>
        <p>Preencha os campos abaixo. Seu feedback é importante pra nós</p>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome"/>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail"/>
            <br/>
            <br/>
            <label for="produtoServico">Produto/Serviço</label>
            <select id="produtoServico" name="produtoServico" required>
            <option value="" selected>
                Selecione...
            </option>
            <option value="paesTradicionais">Pães Tradicionais</option>
            <option value="docesebolos">Doces e Bolos</option>
            <option value="salgados">Salgados</option>
            <option value="atendimento">Atendimento</option>
            <option value="ambiente">Ambiente</option>
            <option value="preco">Preço</option>
        </select>
        <br/>
        <br/>
            <fieldset>
                <legend>Avaliação Geral</legend>
                <input type="radio" id="excelente" name="excelente"/>
                <label for="excelente">Excelente</label>
                    <br/>
                <input type="radio" id="bom" name="Avaliação" value="bom"/>
                <label for="bom">Bom</label>
                 <br/>
                <input type="radio" id="regular" name="Avaliação" value="regular"/>
                <label for="regular">Regular</label>
                    <br/>
                <input type="radio" id="ruim" name="avaliaçãoGeral" value="ruim"/>
                <label for="ruim">Ruim</label>
            </fieldset>
                    <br/>
                <label for="feedback">Feedback:</label>
                <textarea id="feedback" name="feedback" placeholder="Digite aqui seu feedback"  minlength="2" width="120"></textarea>
                    <br/>
                    <br/>
                    <br/>
                <input type="checkbox" id="recomendacao" name="recomendacao" value="sim"/>
                <label for="recomendacao">Recomendaria par amigos?</label>
                    <br/>
                <input type="checkbox" id="autoriza" name="autorizacaoPublicacao" value="sim"/>
                <label for="autoriza">Autoriza publicação do depoimento?</label>
                <input type="submit" value="Enviar">
        </form>
    </main>
</body>
</html>
